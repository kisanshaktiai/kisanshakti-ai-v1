name: Deploy PWA + Build Mobile Apps

on:
  push:
    branches: [main, production, kisanshakti-ai-update]
  workflow_dispatch:

jobs:
  deploy-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 🧹 Clean previous build
        run: rm -rf node_modules dist package-lock.json

      - name: 📦 Install dependencies
        run: npm install --no-audit
        run: |
          echo "Installing dependencies..."
      
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit || (
              echo "⚠️ npm ci failed, attempting recovery..."
              rm -rf node_modules package-lock.json
              npm install --no-audit
            )
          else
            npm install --no-audit
          fi

      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build
          echo "✅ Build completed successfully"

      - name: 🔍 Validate build output
        run: |
          if [ ! -d ./dist ]; then
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          if [ ! -f ./dist/index.html ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi
          if ls dist/assets/ui-forms-*.js 1>/dev/null 2>&1; then
            echo "❌ ERROR: ui-forms chunk still exists"
            exit 1
          fi
          echo "✅ Build validated"
          echo "📊 Build size: $(du -sh ./dist)"

      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 🚀 Deploy to Hostinger
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='node_modules' \
            --progress \
            ./dist/ \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/"
          echo "✅ PWA deployed successfully"

      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true

  build-android:
    runs-on: ubuntu-latest
    needs: deploy-pwa
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor (Android)
        run: |
          set -euo pipefail
          npm install @capacitor/core @capacitor/cli @capacitor/android
          BACKUP_DIR="$(mktemp -d)"
          shopt -s nullglob
          CONFIG_FILES=(capacitor.config.*)
          if [ ${#CONFIG_FILES[@]} -gt 0 ]; then
            mv capacitor.config.* "$BACKUP_DIR"/ || true
          fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kisanshakti.app",
            "appName": "KisanShakti",
            "webDir": "dist"
          }
          EOF
          if [ -d "android" ]; then
            echo "android/ already exists"
          else
            npx cap add android
          fi
          npx cap sync android
          npx cap copy android
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A "$BACKUP_DIR")" ]; then
            mv "$BACKUP_DIR"/capacitor.config.* . || true
          fi
          rm -rf "$BACKUP_DIR" || true

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    needs: deploy-pwa
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor (iOS)
        run: |
          set -euo pipefail
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          BACKUP_DIR="$(mktemp -d)"
          shopt -s nullglob
          CONFIG_FILES=(capacitor.config.*)
          if [ ${#CONFIG_FILES[@]} -gt 0 ]; then
            mv capacitor.config.* "$BACKUP_DIR"/ || true
          fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kisanshakti.app",
            "appName": "KisanShakti",
            "webDir": "dist"
          }
          EOF
          if [ -d "ios" ] && [ -d "ios/App" ]; then
            echo "ios/ already exists"
          else
            npx cap add ios
          fi
          npx cap sync ios
          npx cap copy ios
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A "$BACKUP_DIR")" ]; then
            mv "$BACKUP_DIR"/capacitor.config.* . || true
          fi
          rm -rf "$BACKUP_DIR" || true

      - name: 📦 Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: 🔨 Build iOS App (Debug)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            archive

      - name: 📦 Export IPA (Debug)
        run: |
          cd ios/App
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-ios.ipa
          path: ios/App/build/*.ipa
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: [deploy-pwa, build-android, build-ios]
    if: always()
    steps:
      - name: 🎉 Deployment Summary
        run: |
          echo "✅ PWA: https://kisanshaktiai.in"
          echo "✅ Android APK: Check Artifacts tab"
          echo "✅ iOS IPA: Check Artifacts tab"
