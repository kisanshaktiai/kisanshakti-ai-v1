name: Deploy PWA + Build Mobile Apps

on:
  push:
    branches: [main, production, kisanshakti-ai-update]
  workflow_dispatch:

jobs:
  # Job 1: Build and Deploy PWA to Hostinger
  deploy-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Verify Node version
        run: |
          node --version
          npm --version

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then 
            npm ci --prefer-offline --no-audit
          else 
            npm install --no-audit
          fi

      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build
          echo "✅ Build completed successfully"

      - name: ✅ Verify build output
        run: |
          echo "🔍 Checking build output..."
          
          if [ ! -d ./dist ]; then 
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          
          if [ ! -f ./dist/index.html ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi
          
          echo "✅ index.html exists"
          
          if [ -f ./dist/.htaccess ]; then
            echo "✅ .htaccess found"
          fi
          
          if [ -f ./dist/manifest.json ]; then
            echo "✅ manifest.json found"
          fi
          
          echo "📊 Build size: $(du -sh ./dist)"

      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 🚀 Deploy to Hostinger
        run: |
          echo "🚀 Starting deployment..."
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='node_modules' \
            --progress \
            ./dist/ \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/"
          echo "✅ PWA deployed successfully"

      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true

  # Job 2: Build Android APK
  build-android:
    runs-on: ubuntu-latest
    needs: deploy-pwa
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor (Android)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # If no capacitor config file exists, run init (kept for compatibility)
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            echo "No capacitor.config.* found — running npx cap init"
            npx cap init "KisanShaktiAI" "com.kisanshaktiAi.app" --web-dir=dist
          else
            echo "Found capacitor.config.* — will validate appId"
          fi

          # Try to extract appId from any capacitor.config.* (works for simple cases)
          APP_ID=""
          if grep -q "appId" capacitor.config.* 2>/dev/null; then
            APP_ID=$(grep -oP 'appId\s*[:=]\s*["'"'"']\K[^"'"'"']+' capacitor.config.* 2>/dev/null | head -n1 || true)
          fi

          # Validate appId against required pattern: ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$
          VALID_REGEX='^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'
          if [ -z "$APP_ID" ] || ! echo "$APP_ID" | grep -Eq "$VALID_REGEX"; then
            echo "Invalid or missing App ID detected: '${APP_ID:-<none>}'"
            echo "Creating a temporary capacitor.config.json with a valid appId..."

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kisanshaktiAi.app",
            "appName": "KisanShaktiAI",
            "webDir": "dist"
          }
          EOF

            echo "Wrote capacitor.config.json (overrides invalid config for CI run)."
          else
            echo "Valid App ID found: $APP_ID — using existing config."
          fi

          # Only add android platform if not present
          if [ -d "android" ]; then
            echo "android/ already exists — skipping npx cap add android"
          else
            echo "Adding android platform"
            npx cap add android
          fi

          # Always sync/copy to ensure native project has latest web assets
          npx cap sync android
          npx cap copy android



      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ✅ Android Build Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📱 Android APK Build Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Debug APK: Available in Artifacts"

  # Job 3: Build iOS IPA
  build-ios:
    runs-on: macos-latest
    needs: deploy-pwa
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor (iOS)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # If no capacitor config file exists, run init. Otherwise skip.
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            echo "No capacitor.config.* found — running npx cap init"
            npx cap init "KisanShakti" "com.kisanshakti.app" --web-dir=dist
          else
            echo "Found capacitor.config.* — skipping npx cap init"
          fi

          # Only add ios platform if not present
          if [ -d "ios" ] && [ -d "ios/App" ]; then
            echo "ios/ already exists — skipping npx cap add ios"
          else
            echo "Adding ios platform"
            npx cap add ios
          fi

          # Always sync/copy to ensure native project has latest web assets
          npx cap sync ios
          npx cap copy ios


      - name: 📦 Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: 🔨 Build iOS App (Debug)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            archive

      - name: 📦 Export IPA (Debug)
        run: |
          cd ios/App
          
          # Create export options
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-ios.ipa
          path: ios/App/build/*.ipa
          retention-days: 30

      - name: ✅ iOS Build Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🍎 iOS IPA Build Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ IPA: Available in Artifacts"

  # Job 4: Build Summary
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-pwa, build-android, build-ios]
    if: always()

    steps:
      - name: 🎉 Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 BUILD & DEPLOYMENT COMPLETE!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ PWA: https://kisanshaktiai.in"
          echo "✅ Android APK: Check Artifacts tab"
          echo "✅ iOS IPA: Check Artifacts tab"
          echo ""
          echo "📱 Download apps from:"
          echo "   Actions → Workflow run → Artifacts"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
