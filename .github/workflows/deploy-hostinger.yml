name: Deploy PWA + Build Mobile Apps

on:
  push:
    branches: [main, production, kisanshakti-ai-update]
  workflow_dispatch:

jobs:
  # Job 1: Build and Deploy PWA to Hostinger
  deploy-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Verify Node version
        run: |
          node --version
          npm --version

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then 
            npm ci --prefer-offline --no-audit
          else 
            npm install --no-audit
          fi

      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build
          echo "✅ Build completed successfully"

      - name: ✅ Verify build output
        run: |
          echo "🔍 Checking build output..."
          
          if [ ! -d ./dist ]; then 
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          
          if [ ! -f ./dist/index.html ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi
          
          echo "✅ index.html exists"
          
          if [ -f ./dist/.htaccess ]; then
            echo "✅ .htaccess found"
          fi
          
          if [ -f ./dist/manifest.json ]; then
            echo "✅ manifest.json found"
          fi
          
          echo "📊 Build size: $(du -sh ./dist)"

      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 🚀 Deploy to Hostinger
        run: |
          echo "🚀 Starting deployment..."
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='node_modules' \
            --progress \
            ./dist/ \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/"
          echo "✅ PWA deployed successfully"

      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true

  # Job 2: Build Android APK
  build-android:
    runs-on: ubuntu-latest
    needs: deploy-pwa
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor (Android)
        run: |
          set -euo pipefail
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Backup any existing capacitor.config.* so Capacitor won't read it
          BACKUP_DIR="$(mktemp -d)"
          shopt -s nullglob
          CONFIG_FILES=(capacitor.config.*)
          if [ ${#CONFIG_FILES[@]} -gt 0 ]; then
            echo "Backing up existing capacitor config files to $BACKUP_DIR"
            mv capacitor.config.* "$BACKUP_DIR"/ || true
          else
            echo "No existing capacitor.config.* files found"name: Deploy PWA + Build Mobile Apps

