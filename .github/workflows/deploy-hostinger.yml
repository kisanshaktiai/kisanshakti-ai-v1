name: Deploy PWA + Build Mobile Apps

on:
  push:
    branches: [main, production, kisanshakti-ai-update]
  workflow_dispatch:

jobs:
  # Job 1: Build and Deploy PWA to Hostinger
  deploy-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then 
            npm ci --prefer-offline --no-audit
          else 
            npm install --no-audit
          fi

      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build
          echo "✅ Build completed successfully"

      - name: ✅ Verify build output
        run: |
          echo "🔍 Checking build output..."
          
          if [ ! -d ./dist ]; then 
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          
          if [ ! -f ./dist/index.html ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi
          
          echo "✅ index.html exists"
          
          if [ -f ./dist/.htaccess ]; then
            echo "✅ .htaccess found"
          fi
          
          if [ -f ./dist/manifest.json ]; then
            echo "✅ manifest.json found"
          fi
          
          echo "📊 Build size: $(du -sh ./dist)"

      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 🚀 Deploy to Hostinger
        run: |
          echo "🚀 Starting deployment..."
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='node_modules' \
            --progress \
            ./dist/ \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/"
          echo "✅ PWA deployed successfully"

      - name: 🔄 Purge Cloudflare cache
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID != '' }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "✅ Cache purged"

      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true

  # Job 2: Build Android APK
  build-android:
    runs-on: ubuntu-latest
    needs: deploy-pwa
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "KisanShakti" "com.kisanshakti.app" --web-dir=dist
          npx cap add android
          npx cap sync android
          npx cap copy android

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🔨 Build Release APK (if keystore exists)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          # Decode keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/release.keystore
          
          # Create signing config
          cat >> android/app/build.gradle << EOF
          
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'
                      keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 📤 Upload Release APK
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: ✅ Android Build Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📱 Android APK Build Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Debug APK: Available in Artifacts"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "✅ Release APK: Available in Artifacts (Signed)"
          else
            echo "⚠️  Release APK: Skipped (No keystore configured)"
          fi

  # Job 3: Build iOS IPA
  build-ios:
    runs-on: macos-latest
    needs: deploy-pwa
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build web app
        run: npm run build

      - name: 📱 Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "KisanShakti" "com.kisanshakti.app" --web-dir=dist
          npx cap add ios
          npx cap sync ios
          npx cap copy ios

      - name: 📦 Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: 🔨 Build iOS App (Debug)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            archive

      - name: 📦 Export IPA (Debug)
        run: |
          cd ios/App
          
          # Create export options
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $PWD/build/KisanShakti.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-ios.ipa
          path: ios/App/build/*.ipa
          retention-days: 30

      - name: ✅ iOS Build Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🍎 iOS IPA Build Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ IPA: Available in Artifacts"
          echo "⚠️  Note: For App Store, configure signing in Xcode"

  # Job 4: Build Summary
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-pwa, build-android, build-ios]
    if: always()

    steps:
      - name: 🎉 Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 BUILD & DEPLOYMENT COMPLETE!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ PWA: https://kisanshaktiai.in"
          echo "✅ Android APK: Check Artifacts tab"
          echo "✅ iOS IPA: Check Artifacts tab"
          echo ""
          echo "📱 Download apps from:"
          echo "   Actions → Workflow run → Artifacts"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
