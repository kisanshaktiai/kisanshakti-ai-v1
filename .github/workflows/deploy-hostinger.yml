name: Deploy to Hostinger

on:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/
          echo "Checking manifest.json..."
          cat dist/manifest.json
          echo "Checking service-worker.js exists..."
          ls -la dist/service-worker.js

      - name: Copy manifest.json to root (if not already)
        run: |
          if [ ! -f "dist/manifest.json" ]; then
            echo "manifest.json not in dist root, copying..."
            cp public/manifest.json dist/manifest.json
          fi

      - name: Copy service-worker.js to root (if not already)
        run: |
          if [ ! -f "dist/service-worker.js" ]; then
            echo "service-worker.js not in dist root, copying..."
            cp public/service-worker.js dist/service-worker.js
          fi

      - name: Create .htaccess for proper MIME types
        run: |
          cat > dist/.htaccess << 'EOF'
          # PWA Service Worker & Manifest MIME Types
          <FilesMatch "\.(json|webmanifest)$">
            Header set Content-Type "application/json"
            Header set Cache-Control "no-cache, no-store, must-revalidate"
          </FilesMatch>

          <FilesMatch "service-worker\.js$">
            Header set Content-Type "application/javascript"
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Service-Worker-Allowed "/"
          </FilesMatch>

          # Security Headers
          Header always set X-Content-Type-Options "nosniff"
          Header always set X-Frame-Options "DENY"
          Header always set X-XSS-Protection "1; mode=block"
          Header always set Referrer-Policy "strict-origin-when-cross-origin"

          # HTTPS Redirect (if not already on HTTPS)
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          # SPA Routing (React Router)
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "Verifying PWA files are accessible..."
          curl -I https://your-domain.com/manifest.json
          curl -I https://your-domain.com/service-worker.js

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "📱 PWA files deployed to root"
          echo "🔒 Security headers configured"
          echo "🚀 App version: ${{ github.sha }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs above for errors"
    branches: [ kisanshakti-ai-update ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HOST_SFTP_HOST: ${{ secrets.HOST_SFTP_HOST }}
      HOST_SFTP_PORT: ${{ secrets.HOST_SFTP_PORT }}
      HOST_SFTP_USER: ${{ secrets.HOST_SFTP_USER }}
      HOST_REMOTE_DIR: ${{ secrets.HOST_REMOTE_DIR }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then 
            npm ci --prefer-offline --no-audit
          else 
            npm install --no-audit
          fi

      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
        run: |
          npm run build
          echo "✅ Build completed successfully"

      - name: ✅ Verify SPA routing files
        run: |
          echo "🔍 Checking for routing configuration files..."
          
          if [ ! -d ./dist ]; then 
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          
          # Check for .htaccess (Apache routing)
          if [ -f ./dist/.htaccess ]; then
            echo "✅ .htaccess found (Apache SPA routing configured)"
            echo "📄 .htaccess content:"
            head -20 ./dist/.htaccess
          else
            echo "⚠️  WARNING: .htaccess not found - SPA routing may not work on Apache servers!"
          fi
          
          # Check for _redirects (Netlify-style routing)
          if [ -f ./dist/_redirects ]; then
            echo "✅ _redirects found (Netlify-style routing configured)"
          fi
          
          # Verify index.html exists
          if [ ! -f ./dist/index.html ]; then
            echo "❌ ERROR: index.html not found in dist!"
            exit 1
          fi
          
          echo ""
          echo "📊 Build output summary:"
          du -sh ./dist
          echo "Total files: $(find dist -type f | wc -l)"

      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Decode and save private key
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          # Setup known_hosts for security
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          
          echo "✅ SSH authentication configured"

      - name: 🧪 Test SSH connection
        run: |
          echo "Testing SSH connection to Hostinger..."
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.HOST_SFTP_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}" \
            "echo '✅ SSH connection successful!' && pwd" || {
              echo "❌ SSH connection failed!"
              exit 1
            }

      - name: 🚀 Deploy to Hostinger via rsync over SSH
        run: |
          echo "🚀 Starting deployment to Hostinger..."
          
          # Use rsync for efficient, reliable deployment
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --progress \
            ./dist/ \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/" || {
              echo "❌ Deployment failed!"
              exit 1
            }
          
          echo "✅ Files deployed successfully"

      - name: 🔒 Set proper file permissions
        run: |
          echo "Setting correct file permissions on server..."
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.HOST_SFTP_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}" <<'ENDSSH'
            cd ${{ secrets.HOST_REMOTE_DIR }}
            
            # Set directory permissions
            find . -type d -exec chmod 755 {} \;
            
            # Set file permissions
            find . -type f -exec chmod 644 {} \;
            
            # Ensure .htaccess is readable
            if [ -f .htaccess ]; then
              chmod 644 .htaccess
              echo "✅ .htaccess permissions set"
            fi
            
            echo "✅ Permissions updated successfully"
          ENDSSH

      - name: ✅ Verify deployment
        run: |
          echo "🔍 Verifying deployment on server..."
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.HOST_SFTP_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}" <<'ENDSSH'
            cd ${{ secrets.HOST_REMOTE_DIR }}
            
            echo "📁 Deployed files:"
            ls -lah | head -20
            
            echo ""
            echo "🔍 Checking critical files:"
            
            if [ -f index.html ]; then
              echo "✅ index.html exists"
            else
              echo "❌ index.html missing!"
              exit 1
            fi
            
            if [ -f .htaccess ]; then
              echo "✅ .htaccess exists (SPA routing enabled)"
            else
              echo "⚠️  .htaccess missing - SPA routing may not work!"
            fi
            
            echo ""
            echo "✅ Deployment verification complete"
          ENDSSH

      - name: 🔄 Purge Cloudflare cache
        if: env.CF_API_TOKEN != '' && env.CF_ZONE_ID != ''
        run: |
          echo "🔄 Purging Cloudflare cache..."
          
          response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          
          if echo "$response" | jq -e '.success == true' > /dev/null; then
            echo "✅ Cloudflare cache purged successfully"
          else
            echo "⚠️  Cache purge may have failed:"
            echo "$response" | jq '.'
          fi

      - name: 🧹 Cleanup SSH keys
        if: always()
        run: |
          if [ -f "$HOME/.ssh/deploy_key" ]; then
            shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          fi
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "✅ SSH keys cleaned up"

      - name: 🎉 Deployment summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ App deployed to: https://kisanshaktiai.in"
          echo "✅ SPA routing: Configured (.htaccess)"
          echo "✅ Cloudflare cache: Purged"
          echo ""
          echo "🔍 Test these URLs to verify routing:"
          echo "   - https://kisanshaktiai.in/"
          echo "   - https://kisanshaktiai.in/app/weather"
          echo "   - https://kisanshaktiai.in/app/schedule"
          echo "   - Try refreshing each page!"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
