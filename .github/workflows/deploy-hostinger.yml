name: Deploy PWA + Build Mobile Apps

on:
  push:
    branches: [main, production, kisanshakti-ai-update]
  workflow_dispatch:

jobs:
  deploy-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: bun run build
      - name: ✅ Verify build output
        run: |
          test -d ./dist && test -f ./dist/index.html || { echo "❌ ERROR: production build output is missing"; exit 1; }
      - name: 🔐 Setup SSH authentication
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SFTP_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" ]; then echo "${{ secrets.HOST_SFTP_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"; else ssh-keyscan -p "${{ secrets.HOST_SFTP_PORT }}" "${{ secrets.HOST_SFTP_HOST }}" >> "$HOME/.ssh/known_hosts" 2>/dev/null; fi
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: 🚀 Deploy to Hostinger
        run: |
          rsync -avz --delete -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.HOST_SFTP_PORT }} -o StrictHostKeyChecking=no" --exclude='.git*' --exclude='node_modules' --progress ./dist/ "${{ secrets.HOST_SFTP_USER }}@${{ secrets.HOST_SFTP_HOST }}:${{ secrets.HOST_REMOTE_DIR }}/"
      - name: 🔄 Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data '{"purge_everything":true}'
      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -u "$HOME/.ssh/deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/deploy_key"
          rm -f "$HOME/.ssh/known_hosts" 2>/dev/null || true

  build-android:
    runs-on: ubuntu-latest
    needs: deploy-pwa
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: ✅ Verify Java toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          JAVA_MAJOR=$(java -version 2>&1 | sed -n 's/.*version "\([0-9]*\).*/\1/p' | head -1)
          test "$JAVA_MAJOR" = "21" || { echo "❌ CI is not using JDK 21"; exit 1; }
      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build web app
        run: bun run build
      - name: 📱 Setup Capacitor
        run: |
          test -f capacitor.config.ts || { echo "❌ capacitor.config.ts not found"; exit 1; }
          if [ -d "android" ]; then echo "android/ already exists — using existing native project"; else bunx cap add android; fi
          bunx cap sync android
          bunx cap copy android
      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: 🔨 Build Release APK (if keystore exists)
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          cat >> android/app/build.gradle << EOF
          android {
              signingConfigs { release { storeFile file('release.keystore'); storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'; keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'; keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}' } }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
          cd android
          ./gradlew assembleRelease --stacktrace
      - name: 📤 Upload Release APK
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: ✅ Android Build Summary
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "✅ Release APK: Available in Artifacts (Signed)"; else echo "⚠️ Release APK: Skipped (No keystore configured)"; fi

  build-ios:
    runs-on: macos-latest
    needs: deploy-pwa
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build web app
        run: bun run build
      - name: 📱 Setup Capacitor
        run: |
          test -f capacitor.config.ts || { echo "❌ capacitor.config.ts not found"; exit 1; }
          if [ -d "ios" ] && [ -d "ios/App" ]; then echo "ios/ already exists — using existing native project"; else bunx cap add ios; fi
          bunx cap sync ios
          bunx cap copy ios
      - name: 📦 Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install
      - name: 🔨 Build iOS App (Debug)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -archivePath $PWD/build/KisanShakti.xcarchive archive
      - name: 📦 Export IPA (Debug)
        run: |
          cd ios/App
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>development</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $PWD/build/KisanShakti.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build
      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kisanshakti-ios.ipa
          path: ios/App/build/*.ipa
          retention-days: 30
      - name: ✅ iOS Build Summary
        run: echo "🍎 iOS IPA Build Complete!"

  summary:
    runs-on: ubuntu-latest
    needs: [deploy-pwa, build-android, build-ios]
    if: always()
    steps:
      - name: 🎉 Deployment Summary
        run: |
          echo "🎉 BUILD & DEPLOYMENT COMPLETE!"
          echo "✅ PWA: https://app.kisanshaktiai.in"
          echo "✅ Android APK: Check Artifacts tab"
          echo "✅ iOS IPA: Check Artifacts tab"
