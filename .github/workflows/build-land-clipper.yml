name: Build and Push Land Clipper Worker

on:
  push:
    branches:
      - main
      - kisanshakti-ai-update   # now works on both branches

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.KSHARVESTWORKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KSHARVESTWORKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KSHARVESTWORKER_AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.KSHARVESTWORKER_AZURE_CLIENT_SECRET }}

      - name: Azure Container Registry Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.KSHARVESTWORKER_AZURE_CLIENT_ID }}
          password: ${{ secrets.KSHARVESTWORKER_AZURE_CLIENT_SECRET }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/land-clipper-worker:latest .
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/land-clipper-worker:latest
