name: Trigger auto deployment for ks-harvest-worker

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ks-harvest-worker-AutoDeployTrigger-235b6aa5-4e21-4810-87f4-06b02c0646e9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KSHARVESTWORKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KSHARVESTWORKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KSHARVESTWORKER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.KSHARVESTWORKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KSHARVESTWORKER_REGISTRY_PASSWORD }}
          containerAppName: ks-harvest-worker
          resourceGroup: rg-kisanshakti
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


