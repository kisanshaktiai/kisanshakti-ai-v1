name: YieldShield surgical regression (no deployment)
on:
  pull_request:
    paths:
      - 'supabase/functions/ai-smart-schedule/**'
      - 'supabase/functions/schedule-reconciler/**'
      - 'supabase/functions/schedules-api/**'
      - 'supabase/functions/weather/**'
      - 'supabase/migrations/**'
      - 'src/pages/Schedule.tsx'
      - 'src/components/schedule/**'
      - 'src/services/schedulesApi.ts'
      - 'tests/schedule/**'
      - '.github/workflows/yieldshield-schedule-safety.yml'
permissions:
  contents: read
jobs:
  no-deploy-schedule-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun from npm registry (GitHub release mirror unavailable)
        run: npm install --global bun@1.4.4
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Verify YieldShield decision guards
        run: bun run test -- tests/schedule/yieldshield_decision_contract.test.ts
      - name: Production build without deploying
        run: bun run build
