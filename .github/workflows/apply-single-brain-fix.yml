name: Apply Single Brain Production Fix

on:
  push:
    branches:
      - fix/production-single-brain

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fail-closed transformation
        run: python tools/apply_single_brain_fix.py
      - name: Commit transformed evaluator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git add supabase/functions/proactive-evaluator/index.ts
          git commit -m "fix: proactive evaluator uses decision-grade NDVI"
          git push origin HEAD:fix/production-single-brain
