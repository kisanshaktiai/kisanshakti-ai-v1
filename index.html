  <body>
  <body>
    <div id="root"></div>

    <!--
      Start shell: painted before any JavaScript, from what the last visit
      cached (the tenant's mark, name and colours), and kept on screen, outside
      React's root, until the app says it is ready. One loading surface, in the
      tenant's theme, for cold starts and reloads alike. No library, no
      network, no words it has not been given in the farmer's language.
    -->
    <style>
      #ks-shell {
        --ks-primary: 0 0% 46%;
        --ks-bg: 0 0% 100%;
        --ks-fg: 0 0% 12%;
        --ks-muted: 0 0% 45%;
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px;
        background: hsl(var(--ks-bg)); color: hsl(var(--ks-fg));
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif;
        transition: opacity .22s ease-out;
      }
      #ks-shell.ks-out { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) { #ks-shell:not(.ks-themed) { --ks-bg: 0 0% 7%; --ks-fg: 0 0% 95%; --ks-muted: 0 0% 65%; } }

      .ks-mark {
        position: relative; width: 88px; height: 88px; display: grid; place-items: center;
      }
      .ks-mark::before {
        content: ""; position: absolute; inset: -14px; border-radius: 50%;
        background: hsl(var(--ks-primary) / .14);
        animation: ks-breathe 2.4s ease-in-out infinite;
      }
      .ks-mark::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid hsl(var(--ks-primary) / .35);
      }
      .ks-mark img, .ks-mark svg {
        position: relative; width: 56px; height: 56px; object-fit: contain; border-radius: 12px;
      }
      .ks-mark svg { color: hsl(var(--ks-primary)); }
      @keyframes ks-breathe { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.06); opacity: 1; } }

      .ks-name { font-size: 18px; font-weight: 700; letter-spacing: .01em; text-align: center; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.3em; }

      .ks-bar { position: relative; width: min(220px, 60vw); height: 4px; border-radius: 999px; background: hsl(var(--ks-primary) / .15); overflow: hidden; }
      .ks-bar i {
        position: absolute; inset: 0 auto 0 0; width: 12%; border-radius: inherit;
        background: hsl(var(--ks-primary)); transition: width .45s cubic-bezier(.2,.8,.2,1);
      }
      .ks-bar i::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(90deg, transparent, hsl(var(--ks-bg) / .55), transparent);
        animation: ks-shimmer 1.4s linear infinite;
      }
      @keyframes ks-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

      .ks-stage { font-size: 14px; color: hsl(var(--ks-muted)); text-align: center; min-height: 1.4em; }

      .ks-retry {
        display: none; align-items: center; gap: 8px; margin-top: 8px;
        min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid hsl(var(--ks-primary) / .5);
        background: transparent; color: hsl(var(--ks-primary)); font: inherit; font-size: 15px; font-weight: 600;
      }
      .ks-retry.ks-show { display: inline-flex; }
      .ks-retry svg { width: 20px; height: 20px; }

      @media (prefers-reduced-motion: reduce) {
        .ks-mark::before, .ks-bar i::after { animation: none; }
        #ks-shell { transition: none; }
      }
    </style>

    <div id="ks-shell" role="status" aria-live="polite">
      <div class="ks-mark">
        <img id="ks-logo" alt="" hidden>
        <svg id="ks-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21v-9"/>
          <path d="M12 12c0-3.5 2.5-6 6-6 0 3.5-2.5 6-6 6z"/>
          <path d="M12 15c0-3-2.2-5-5.5-5 0 3 2.2 5 5.5 5z"/>
        </svg>
      </div>
      <div id="ks-name" class="ks-name"></div>
      <div class="ks-bar"><i id="ks-fill"></i></div>
      <div id="ks-stage" class="ks-stage"></div>
      <button id="ks-retry" type="button" class="ks-retry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span id="ks-retry-text"></span>
      </button>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var shell = document.getElementById('ks-shell');
        if (!shell) return;
        var fill = document.getElementById('ks-fill');
        var stageEl = document.getElementById('ks-stage');
        var retry = document.getElementById('ks-retry');
        var SLOW_AFTER_MS = 15000;
        var words = {};

        function read(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }

        // Colour: "#rrggbb" -> "h s% l%" (the form the app's theme tokens use).
        function hsl(hex) {
          var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
          if (!m) return null;
          var n = parseInt(m[1], 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
          var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0, d = max - min;
          if (d) {
            s = l > .5 ? d / (2 - max - min) : d / (max + min);
            h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? ((b - r) / d + 2) : ((r - g) / d + 4);
            h /= 6;
          }
          return Math.round(h * 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%';
        }

        // What the last visit cached: tenant mark, name and colours.
        var cached = read('tenant_config_cache');
        var data = cached && cached.data ? cached.data : null;
        var branding = data && data.branding ? data.branding : null;
        if (branding) {
          var primary = hsl(branding.primary_color), bg = hsl(branding.background_color);
          if (primary) { shell.style.setProperty('--ks-primary', primary); shell.classList.add('ks-themed'); }
          if (bg) {
            shell.style.setProperty('--ks-bg', bg);
            var light = parseInt(bg.split(' ')[2], 10) > 50;
            shell.style.setProperty('--ks-fg', light ? '0 0% 12%' : '0 0% 95%');
            shell.style.setProperty('--ks-muted', light ? '0 0% 45%' : '0 0% 65%');
          }
          var name = branding.company_name || data.name;
          if (name) document.getElementById('ks-name').textContent = name;
          if (branding.logo_url) {
            var img = document.getElementById('ks-logo');
            img.onload = function () { img.hidden = false; document.getElementById('ks-fallback').hidden = true; };
            img.src = branding.logo_url;
          }
        }

        // Words the app saved in the farmer's language; none on a first visit.
        words = read('ks_shell_text') || {};
        var PCT = { starting: 20, connecting: 45, signing_in: 70, opening: 90 };
        function setStage(key) {
          if (fill) fill.style.width = (PCT[key] || 20) + '%';
          if (stageEl) stageEl.textContent = words[key] || '';
        }

        var finished = false;
        function done() {
          if (finished) return;
          finished = true;
          clearTimeout(slowTimer);
          if (fill) fill.style.width = '100%';
          shell.classList.add('ks-out');
          setTimeout(function () { if (shell.parentNode) shell.parentNode.removeChild(shell); }, 260);
        }

        var slowTimer = setTimeout(function () {
          if (finished) return;
          if (stageEl && words.slow) stageEl.textContent = words.slow;
          document.getElementById('ks-retry-text').textContent = words.retry || '';
          retry.setAttribute('aria-label', words.retry || 'retry');
          retry.classList.add('ks-show');
        }, SLOW_AFTER_MS);
        retry.addEventListener('click', function () { window.location.reload(); });

        setStage('starting');
        window.__ksShell = { stage: setStage, done: done };
      })();
    </script>
  </body>
</html>
