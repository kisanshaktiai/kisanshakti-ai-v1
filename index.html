<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KisanShakti - Empowering Farmers</title>
    <meta
      name="description"
      content="Digital platform empowering Indian farmers with weather updates, market prices, advisory services, and government schemes"
    />
    <meta name="theme-color" content="#22c55e" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --brand-primary: #10b981;
        --brand-primary-rgb: 16, 185, 129;
        --brand-dark: #059669;
        --brand-light: #34d399;
        --brand-glow: rgba(16, 185, 129, 0.4);
        --surface: #ffffff;
        --surface-glass: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.8);
        --text-tertiary: rgba(255, 255, 255, 0.6);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.3);
        --shadow-glow: 0 0 40px var(--brand-glow);
        --timing-fast: 0.2s;
        --timing-normal: 0.4s;
        --timing-slow: 0.8s;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        overflow: hidden;
      }

      /* Main Loader Container */
      .ks-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-dark) 100%);
        z-index: 99999;
        overflow: hidden;
        isolation: isolate;
      }

      /* Animated Background Pattern */
      .ks-loader::before {
        content: '';
        position: absolute;
        inset: -50%;
        background:
          radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
        animation: bg-float 20s ease-in-out infinite;
      }

      @keyframes bg-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(2%, -2%) scale(1.02); }
        66% { transform: translate(-2%, 2%) scale(0.98); }
      }

      /* Particle System */
      .ks-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .ks-particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: particle-float linear infinite;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      @keyframes particle-float {
        0% {
          transform: translateY(100vh) translateX(0) scale(0);
          opacity: 0;
        }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% {
          transform: translateY(-100px) translateX(var(--drift)) scale(1);
          opacity: 0;
        }
      }

      /* Main Content Container */
      .ks-loader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(24px, 5vw, 40px);
        padding: clamp(20px, 4vw, 40px);
        z-index: 1;
        animation: content-entrance 0.8s var(--ease-out-expo) forwards;
      }

      @keyframes content-entrance {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Logo/Animation Container */
      .ks-animation-wrapper {
        position: relative;
        width: clamp(160px, 35vw, 280px);
        height: clamp(160px, 35vw, 280px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Rotating Glow Ring */
      .ks-glow-ring {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          var(--brand-glow) 90deg,
          transparent 180deg,
          var(--brand-glow) 270deg,
          transparent 360deg
        );
        animation: ring-rotate 3s linear infinite;
        filter: blur(20px);
        opacity: 0.6;
      }

      @keyframes ring-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Pulsing Circle Background */
      .ks-pulse-bg {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--brand-light), transparent 70%);
        animation: pulse-grow 2s ease-in-out infinite;
      }

      @keyframes pulse-grow {
        0%, 100% {
          transform: scale(0.9);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.2;
        }
      }

      /* Main Animation Container */
      .ks-animation-main {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-glass);
        backdrop-filter: blur(40px);
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow:
          var(--shadow-lg),
          inset 0 0 40px rgba(255, 255, 255, 0.1);
      }

      /* SVG Agriculture Animation */
      .ks-agri-svg {
        width: 70%;
        height: 70%;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.2));
      }

      /* Hide all animations by default */
      .animation-scene {
        display: none;
      }

      .animation-scene.active {
        display: block;
      }

      /* ========================================
         ANIMATION 1: SOIL PREPARATION (Plowing)
         ======================================== */
      .scene-soil .tractor {
        animation: tractor-move 4s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes tractor-move {
        0%, 100% { transform: translateX(-15px); }
        50% { transform: translateX(15px); }
      }

      .scene-soil .soil-line {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: soil-draw 2s ease-in-out infinite;
      }

      @keyframes soil-draw {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .scene-soil .wheel {
        animation: wheel-rotate 1s linear infinite;
        transform-origin: center;
      }

      @keyframes wheel-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* ========================================
         ANIMATION 2: SOWING SEEDS
         ======================================== */
      .scene-sowing .seed {
        animation: seed-fall 2s ease-in infinite;
        opacity: 0;
      }

      @keyframes seed-fall {
        0% {
          transform: translateY(-20px);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translateY(40px);
          opacity: 0;
        }
      }

      .scene-sowing .seed:nth-child(1) { animation-delay: 0s; }
      .scene-sowing .seed:nth-child(2) { animation-delay: 0.4s; }
      .scene-sowing .seed:nth-child(3) { animation-delay: 0.8s; }
      .scene-sowing .seed:nth-child(4) { animation-delay: 1.2s; }
      .scene-sowing .seed:nth-child(5) { animation-delay: 1.6s; }

      .scene-sowing .hand {
        animation: hand-sow 2s ease-in-out infinite;
        transform-origin: bottom right;
      }

      @keyframes hand-sow {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(15deg) translateY(-5px); }
      }

      /* ========================================
         ANIMATION 3: IRRIGATION (Water Flow)
         ======================================== */
      .scene-irrigation .water-drop {
        animation: water-fall 1.5s ease-in infinite;
        opacity: 0;
      }

      @keyframes water-fall {
        0% {
          transform: translateY(-30px) scale(0.5);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(60px) scale(1.2);
          opacity: 0;
        }
      }

      .scene-irrigation .water-drop:nth-child(1) { animation-delay: 0s; }
      .scene-irrigation .water-drop:nth-child(2) { animation-delay: 0.3s; }
      .scene-irrigation .water-drop:nth-child(3) { animation-delay: 0.6s; }
      .scene-irrigation .water-drop:nth-child(4) { animation-delay: 0.9s; }
      .scene-irrigation .water-drop:nth-child(5) { animation-delay: 1.2s; }

      .scene-irrigation .sprinkler {
        animation: sprinkler-rotate 3s linear infinite;
        transform-origin: center bottom;
      }

      @keyframes sprinkler-rotate {
        0% { transform: rotate(-30deg); }
        50% { transform: rotate(30deg); }
        100% { transform: rotate(-30deg); }
      }

      .scene-irrigation .wave {
        animation: water-wave 2s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes water-wave {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-3px) scaleY(1.1); }
      }

      /* ========================================
         ANIMATION 4: PLANT GROWTH
         ======================================== */
      .scene-growth .plant-stage {
        animation: plant-grow 3s ease-in-out infinite;
        transform-origin: center bottom;
      }

      @keyframes plant-grow {
        0% {
          transform: scaleY(0.3);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(0.7);
          opacity: 0.8;
        }
        100% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .scene-growth .leaf {
        animation: leaf-unfold 2s ease-out infinite;
        transform-origin: bottom center;
      }

      @keyframes leaf-unfold {
        0% {
          transform: scale(0) rotate(-90deg);
          opacity: 0;
        }
        60% {
          transform: scale(1.1) rotate(5deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      .scene-growth .leaf:nth-child(1) { animation-delay: 0s; }
      .scene-growth .leaf:nth-child(2) { animation-delay: 0.3s; }
      .scene-growth .leaf:nth-child(3) { animation-delay: 0.6s; }

      .scene-growth .sun-ray {
        animation: ray-shine 2s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes ray-shine {
        0%, 100% {
          opacity: 0.3;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
      }

      /* ========================================
         ANIMATION 5: PEST MANAGEMENT
         ======================================== */
      .scene-pest .bug {
        animation: bug-move 3s ease-in-out infinite;
      }

      @keyframes bug-move {
        0%, 100% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(15px, -10px) rotate(45deg);
        }
        50% {
          transform: translate(10px, 10px) rotate(90deg);
        }
        75% {
          transform: translate(-10px, 5px) rotate(-45deg);
        }
      }

      .scene-pest .spray-particle {
        animation: spray-shoot 1.5s ease-out infinite;
        opacity: 0;
      }

      @keyframes spray-shoot {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(var(--spray-x), var(--spray-y)) scale(0.2);
          opacity: 0;
        }
      }

      .scene-pest .shield {
        animation: shield-pulse 2s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes shield-pulse {
        0%, 100% {
          opacity: 0.3;
          transform: scale(0.95);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.05);
        }
      }

      /* ========================================
         ANIMATION 6: FLOWERING & POLLINATION
         ======================================== */
      .scene-flower .flower-bloom {
        animation: bloom 3s ease-out infinite;
        transform-origin: center bottom;
      }

      @keyframes bloom {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .scene-flower .petal {
        animation: petal-open 2s ease-out infinite;
        transform-origin: center;
      }

      @keyframes petal-open {
        0% {
          transform: scale(0) rotate(-90deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      .scene-flower .bee {
        animation: bee-fly 4s ease-in-out infinite;
      }

      @keyframes bee-fly {
        0%, 100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(20px, -15px);
        }
        50% {
          transform: translate(30px, 5px);
        }
        75% {
          transform: translate(10px, -10px);
        }
      }

      .scene-flower .bee-wing {
        animation: wing-flap 0.1s linear infinite;
        transform-origin: center;
      }

      @keyframes wing-flap {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.3); }
      }

      .scene-flower .pollen {
        animation: pollen-float 3s ease-in-out infinite;
        opacity: 0;
      }

      @keyframes pollen-float {
        0% {
          transform: translate(0, 0) scale(0);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 0.5;
        }
        100% {
          transform: translate(var(--pollen-x), var(--pollen-y)) scale(1);
          opacity: 0;
        }
      }

      /* ========================================
         ANIMATION 7: HARVESTING
         ======================================== */
      .scene-harvest .crop-full {
        animation: crop-sway 3s ease-in-out infinite;
        transform-origin: center bottom;
      }

      @keyframes crop-sway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }

      .scene-harvest .sickle {
        animation: sickle-cut 2s ease-in-out infinite;
        transform-origin: bottom right;
      }

      @keyframes sickle-cut {
        0%, 100% {
          transform: rotate(-10deg) translateX(0);
        }
        50% {
          transform: rotate(20deg) translateX(-10px);
        }
      }

      .scene-harvest .grain {
        animation: grain-collect 2s ease-in infinite;
        opacity: 0;
      }

      @keyframes grain-collect {
        0% {
          transform: translate(0, -20px) rotate(0deg);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translate(var(--grain-x), 40px) rotate(180deg);
          opacity: 0;
        }
      }

      .scene-harvest .basket {
        animation: basket-fill 3s ease-in-out infinite;
      }

      @keyframes basket-fill {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      /* Text Content */
      .ks-text-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        max-width: 90vw;
      }

      .ks-title {
        font-size: clamp(22px, 5vw, 32px);
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        line-height: 1.2;
        animation: text-shimmer 2s ease-in-out infinite;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(255, 255, 255, 1) 50%,
          rgba(255, 255, 255, 0.8) 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @keyframes text-shimmer {
        0%, 100% { background-position: 200% center; }
        50% { background-position: 0% center; }
      }

      .ks-subtitle {
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.01em;
        animation: fade-pulse 2s ease-in-out infinite;
      }

      @keyframes fade-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      /* Progress Bar */
      .ks-progress-container {
        position: relative;
        width: min(340px, 85vw);
        height: 4px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .ks-progress-bar {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 1),
          rgba(255, 255, 255, 0.9)
        );
        border-radius: 10px;
        animation: progress-load 2s var(--ease-out-expo) infinite;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }

      @keyframes progress-load {
        0% { width: 0%; opacity: 0.5; }
        50% { width: 70%; opacity: 1; }
        100% { width: 100%; opacity: 0.8; }
      }

      /* Loading Dots */
      .ks-loading-dots {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .ks-dot {
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: dot-bounce 1.4s ease-in-out infinite;
      }

      .ks-dot:nth-child(1) { animation-delay: 0s; }
      .ks-dot:nth-child(2) { animation-delay: 0.2s; }
      .ks-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dot-bounce {
        0%, 60%, 100% {
          transform: translateY(0) scale(1);
          opacity: 0.8;
        }
        30% {
          transform: translateY(-10px) scale(1.2);
          opacity: 1;
        }
      }

      /* Responsive Design */
      @media (max-width: 640px) {
        .ks-loader-content {
          gap: 20px;
        }

        .ks-animation-wrapper {
          width: clamp(140px, 32vw, 180px);
          height: clamp(140px, 32vw, 180px);
        }
      }

      /* Reduced Motion Support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Fade Out Animation */
      .ks-loader.fade-out {
        animation: loader-fade-out 0.5s var(--ease-out-expo) forwards;
      }

      @keyframes loader-fade-out {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.05);
        }
      }

      .ks-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="ks-loader" id="ks-main-loader" role="status" aria-live="polite">
        <!-- Particle System -->
        <div class="ks-particles" id="ks-particles-container" aria-hidden="true"></div>

        <!-- Main Content -->
        <div class="ks-loader-content">
          <!-- Animation Wrapper -->
          <div class="ks-animation-wrapper">
            <!-- Rotating Glow Ring -->
            <div class="ks-glow-ring" aria-hidden="true"></div>

            <!-- Pulsing Background -->
            <div class="ks-pulse-bg" aria-hidden="true"></div>

            <!-- Main Animation Container -->
            <div class="ks-animation-main">
              <!-- ANIMATION 1: SOIL PREPARATION -->
              <svg
                class="ks-agri-svg animation-scene scene-soil"
                viewBox="0 0 200 200"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Ground -->
                <rect x="20" y="140" width="160" height="40" fill="rgba(139, 69, 19, 0.3)" rx="5" />

                <!-- Plowed lines -->
                <g class="soil-lines">
                  <path
                    class="soil-line"
                    d="M 30 150 Q 60 145, 90 150"
                    stroke="rgba(255,255,255,0.4)"
                    stroke-width="2"
                    fill="none"
                  />
                  <path
                    class="soil-line"
                    d="M 40 160 Q 70 155, 100 160"
                    stroke="rgba(255,255,255,0.4)"
                    stroke-width="2"
                    fill="none"
                    style="animation-delay: 0.3s;"
                  />
                  <path
                    class="soil-line"
                    d="M 50 170 Q 80 165, 110 170"
                    stroke="rgba(255,255,255,0.4)"
                    stroke-width="2"
                    fill="none"
                    style="animation-delay: 0.6s;"
                  />
                </g>

                <!-- Tractor -->
                <g class="tractor">
                  <!-- Body -->
                  <rect x="110" y="95" width="50" height="30" fill="rgba(255,255,255,0.9)" rx="5" />
                  <rect x="120" y="85" width="30" height="15" fill="rgba(255,255,255,0.7)" rx="3" />

                  <!-- Wheels -->
                  <g class="wheel">
                    <circle
                      cx="125"
                      cy="130"
                      r="10"
                      fill="rgba(255,255,255,0.3)"
                      stroke="rgba(255,255,255,0.9)"
                      stroke-width="2"
                    />
                    <circle cx="125" cy="130" r="5" fill="rgba(255,255,255,0.9)" />
                  </g>
                  <g class="wheel" style="animation-delay: 0.5s;">
                    <circle
                      cx="150"
                      cy="130"
                      r="10"
                      fill="rgba(255,255,255,0.3)"
                      stroke="rgba(255,255,255,0.9)"
                      stroke-width="2"
                    />
                    <circle cx="150" cy="130" r="5" fill="rgba(255,255,255,0.9)" />
                  </g>

                  <!-- Exhaust smoke -->
                  <circle cx="115" cy="80" r="3" fill="rgba(255,255,255,0.5)">
                    <animate attributeName="cy" values="80;60;40" dur="2s" repeatCount="indefinite" />
                    <animate attributeName="r" values="3;5;7" dur="2s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.5;0.3;0" dur="2s" repeatCount="indefinite" />
                  </circle>
                </g>

                <!-- Sun -->
                <circle cx="170" cy="30" r="15" fill="rgba(255,255,255,0.8)" />
                <g class="sun-ray">
                  <line x1="170" y1="15" x2="170" y2="5" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
                  <line x1="185" y1="30" x2="195" y2="30" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
                  <line x1="182" y1="18" x2="190" y2="10" stroke="rgba(255,255,255,0.6)" stroke-width="2" />

    <script>
      // Particle System
      function createParticles() {
        const container = document.getElementById('ks-particles-container');
        const particleCount = window.innerWidth < 768 ? 20 : 40;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'ks-particle';
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.setProperty('--drift', `${(Math.random() - 0.5) * 100}px`);
          particle.style.animationDuration = `${8 + Math.random() * 8}s`;
          particle.style.animationDelay = `${Math.random() * 5}s`;
          container.appendChild(particle);
        }
      }

      // Animation Scene Rotation
      const scenes = [
        { element: 'scene-soil', text: 'Preparing Soil', duration: 4000 },
        { element: 'scene-sowing', text: 'Sowing Seeds', duration: 3000 },
        { element: 'scene-irrigation', text: 'Irrigating Fields', duration: 3000 },
        { element: 'scene-growth', text: 'Growing Crops', duration: 3500 },
        { element: 'scene-pest', text: 'Managing Pests', duration: 3000 },
        { element: 'scene-flower', text: 'Flowering Stage', duration: 3500 },
        { element: 'scene-harvest', text: 'Harvesting Crops', duration: 3500 }
      ];

      let currentScene = 0;

      function rotateScenes() {
        const allScenes = document.querySelectorAll('.animation-scene');
        const loadingText = document.getElementById('ks-loading-text');
        const srStatus = document.getElementById('ks-sr-status');

        // Remove active class from all
        allScenes.forEach(scene => scene.classList.remove('active'));

        // Add active class to current scene
        const currentSceneElement = document.querySelector(`.${scenes[currentScene].element}`);
        if (currentSceneElement) {
          currentSceneElement.classList.add('active');
          loadingText.textContent = scenes[currentScene].text;
          srStatus.textContent = `Loading: ${scenes[currentScene].text}`;
        }

        // Move to next scene
        currentScene = (currentScene + 1) % scenes.length;

        // Schedule next rotation
        setTimeout(rotateScenes, scenes[currentScene].duration);
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', () => {
        createParticles();

        // Start animation rotation immediately
        setTimeout(() => {
          rotateScenes();
        }, 500);

        // Fallback timeout if React fails to load (10 seconds)
        const fallbackTimeout = setTimeout(() => {
          console.warn('⚠️ React loader timeout - removing HTML loader');
          const loader = document.getElementById('ks-main-loader');
          if (loader && loader.style.display !== 'none') {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
        }, 10000);

        // Clear fallback if React successfully loads
        window.addEventListener('__REACT_LOADED__', () => {
          clearTimeout(fallbackTimeout);
        });
      });

      // Performance optimization: Reduce particles on slower devices
      if (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) {
        document.documentElement.style.setProperty('--particle-count', '15');
      }
    </script>
