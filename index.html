<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KisanShakti - Empowering Farmers</title>
    <meta name="description" content="Digital platform empowering Indian farmers with weather updates, market prices, advisory services, and government schemes" />
    <meta name="author" content="KisanShakti" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KisanShakti" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    
    <!-- Open Graph / Social Media Tags -->
    <meta property="og:title" content="KisanShakti - Empowering Farmers" />
    <meta property="og:description" content="Digital platform for Indian farmers" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KisanShakti" />
    <meta name="twitter:description" content="Empowering Indian farmers digitally" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Manifest - Dynamically loaded for tenant branding -->
    <link rel="manifest" id="app-manifest" href="/manifest.json" crossorigin="use-credentials" />
    
    <!-- Android/Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Microsoft Windows/Edge PWA -->
    <meta name="msapplication-TileColor" content="#22c55e" />
    <meta name="msapplication-tap-highlight" content="no" />
  </head>

  <body>
    <div id="root">
      <!-- Instant loading state - shows BEFORE React loads -->
      <style>
        :root {
          --loader-primary: #10b981;
          --loader-dark: #059669;
          --loader-light: #34d399;
        }
        
        .app-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, var(--loader-primary) 0%, var(--loader-dark) 100%);
          z-index: 9999;
          animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .app-loader-content {
          text-align: center;
          animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .app-loader-text {
          color: white;
          font-size: 18px;
          font-weight: 600;
          margin-top: 24px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .app-loader-subtext {
          color: rgba(255, 255, 255, 0.7);
          font-size: 14px;
          margin-top: 8px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Agricultural Animations Container */
        .agri-animation {
          width: 200px;
          height: 200px;
          position: relative;
          display: none;
        }
        .agri-animation.active {
          display: block;
        }
        
        /* Animation 1: Seed to Sprout */
        .anim-seed-sprout .soil {
          position: absolute;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 140px;
          height: 40px;
          background: #92400e;
          border-radius: 20px 20px 0 0;
          animation: soil-appear 0.5s ease-out forwards;
        }
        .anim-seed-sprout .seed {
          position: absolute;
          bottom: 35px;
          left: 50%;
          transform: translateX(-50%);
          width: 12px;
          height: 16px;
          background: #d97706;
          border-radius: 50%;
          animation: seed-crack 1s 0.5s ease-out forwards;
        }
        .anim-seed-sprout .stem {
          position: absolute;
          bottom: 40px;
          left: 50%;
          transform: translateX(-50%);
          width: 4px;
          height: 0;
          background: var(--loader-primary);
          animation: stem-grow 1.5s 1s ease-out forwards;
        }
        .anim-seed-sprout .leaf {
          position: absolute;
          width: 20px;
          height: 30px;
          background: var(--loader-primary);
          border-radius: 0 100% 0 100%;
          opacity: 0;
        }
        .anim-seed-sprout .leaf-left {
          top: 20px;
          left: -15px;
          transform: rotate(-30deg);
          animation: leaf-grow 0.6s 2.3s ease-out forwards;
        }
        .anim-seed-sprout .leaf-right {
          top: 30px;
          right: -15px;
          transform: rotate(150deg);
          animation: leaf-grow 0.6s 2.6s ease-out forwards;
        }
        
        /* Animation 2: Tractor Field */
        .anim-tractor .field {
          position: absolute;
          bottom: 0;
          width: 100%;
          height: 50px;
          background: #92400e;
          border-radius: 10px 10px 0 0;
        }
        .anim-tractor .tractor {
          position: absolute;
          bottom: 50px;
          left: -60px;
          width: 50px;
          height: 40px;
          animation: tractor-move 4s ease-in-out infinite;
        }
        .anim-tractor .tractor-body {
          width: 35px;
          height: 25px;
          background: var(--loader-primary);
          border-radius: 5px;
          position: relative;
        }
        .anim-tractor .tractor-cabin {
          width: 20px;
          height: 15px;
          background: var(--loader-dark);
          position: absolute;
          top: -15px;
          right: 5px;
          border-radius: 3px;
        }
        .anim-tractor .wheel {
          position: absolute;
          background: #1f2937;
          border-radius: 50%;
          border: 2px solid white;
        }
        .anim-tractor .wheel-front {
          width: 15px;
          height: 15px;
          bottom: -8px;
          right: 2px;
          animation: wheel-spin 0.8s linear infinite;
        }
        .anim-tractor .wheel-back {
          width: 20px;
          height: 20px;
          bottom: -10px;
          left: 2px;
          animation: wheel-spin 0.8s linear infinite;
        }
        .anim-tractor .furrow {
          position: absolute;
          bottom: 45px;
          height: 3px;
          background: #78350f;
          opacity: 0;
          animation: furrow-appear 0.5s ease-out forwards;
        }
        .anim-tractor .furrow-1 { left: 0; width: 0; animation-delay: 1s; }
        .anim-tractor .furrow-2 { left: 0; width: 0; animation-delay: 2s; }
        .anim-tractor .furrow-3 { left: 0; width: 0; animation-delay: 3s; }
        
        /* Animation 3: Water Drops */
        .anim-water .ground {
          position: absolute;
          bottom: 0;
          width: 100%;
          height: 40px;
          background: #92400e;
          border-radius: 10px 10px 0 0;
        }
        .anim-water .crop {
          position: absolute;
          bottom: 40px;
          width: 6px;
          background: var(--loader-primary);
          transform-origin: bottom;
          animation: crop-grow 2s ease-out forwards;
        }
        .anim-water .crop-1 { left: 60px; height: 0; animation-delay: 0.5s; }
        .anim-water .crop-2 { left: 90px; height: 0; animation-delay: 0.8s; }
        .anim-water .crop-3 { left: 120px; height: 0; animation-delay: 1.1s; }
        .anim-water .drop {
          position: absolute;
          width: 8px;
          height: 10px;
          background: #3b82f6;
          border-radius: 0 50% 50% 50%;
          opacity: 0;
          animation: drop-fall 1.5s ease-in infinite;
        }
        .anim-water .drop-1 { top: 20px; left: 60px; animation-delay: 0s; }
        .anim-water .drop-2 { top: 20px; left: 90px; animation-delay: 0.3s; }
        .anim-water .drop-3 { top: 20px; left: 120px; animation-delay: 0.6s; }
        
        /* Animation 4: Sunrise Fields */
        .anim-sunrise .field {
          position: absolute;
          bottom: 0;
          width: 100%;
          height: 60px;
          background: linear-gradient(180deg, var(--loader-primary) 0%, #92400e 100%);
          border-radius: 10px 10px 0 0;
        }
        .anim-sunrise .sun {
          position: absolute;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 80px;
          height: 80px;
          background: radial-gradient(circle, #fbbf24 0%, #f59e0b 100%);
          border-radius: 50%;
          animation: sun-rise 3s ease-out forwards;
        }
        .anim-sunrise .ray {
          position: absolute;
          bottom: 40px;
          left: 50%;
          width: 2px;
          height: 40px;
          background: linear-gradient(180deg, #fbbf24 0%, transparent 100%);
          transform-origin: bottom;
          opacity: 0;
          animation: ray-appear 1s ease-out forwards;
        }
        .anim-sunrise .ray-1 { transform: translateX(-50%) rotate(-30deg); animation-delay: 2.5s; }
        .anim-sunrise .ray-2 { transform: translateX(-50%) rotate(-15deg); animation-delay: 2.6s; }
        .anim-sunrise .ray-3 { transform: translateX(-50%) rotate(0deg); animation-delay: 2.7s; }
        .anim-sunrise .ray-4 { transform: translateX(-50%) rotate(15deg); animation-delay: 2.8s; }
        .anim-sunrise .ray-5 { transform: translateX(-50%) rotate(30deg); animation-delay: 2.9s; }
        
        /* Animation 5: Harvest Wheat */
        .anim-harvest .ground {
          position: absolute;
          bottom: 0;
          width: 100%;
          height: 40px;
          background: #92400e;
          border-radius: 10px 10px 0 0;
        }
        .anim-harvest .wheat {
          position: absolute;
          bottom: 40px;
          width: 4px;
          height: 60px;
          background: #d97706;
        }
        .anim-harvest .wheat-head {
          position: absolute;
          top: -8px;
          left: -4px;
          width: 12px;
          height: 8px;
          background: #fbbf24;
          border-radius: 50% 50% 0 0;
        }
        .anim-harvest .wheat-1 {
          left: 50px;
          animation: wheat-sway 2s ease-in-out infinite;
          animation-delay: 0s;
        }
        .anim-harvest .wheat-2 {
          left: 75px;
          animation: wheat-sway 2s ease-in-out infinite;
          animation-delay: 0.2s;
        }
        .anim-harvest .wheat-3 {
          left: 100px;
          animation: wheat-sway 2s ease-in-out infinite;
          animation-delay: 0.4s;
        }
        .anim-harvest .wheat-4 {
          left: 125px;
          animation: wheat-sway 2s ease-in-out infinite;
          animation-delay: 0.6s;
        }
        .anim-harvest .wheat-5 {
          left: 150px;
          animation: wheat-sway 2s ease-in-out infinite;
          animation-delay: 0.8s;
        }
        
        /* Keyframe Animations */
        @keyframes soil-appear {
          0% { transform: translateX(-50%) scaleY(0); }
          100% { transform: translateX(-50%) scaleY(1); }
        }
        @keyframes seed-crack {
          0%, 50% { transform: translateX(-50%) scale(1); }
          60% { transform: translateX(-50%) scale(1.2); }
          100% { transform: translateX(-50%) scale(0.8); opacity: 0; }
        }
        @keyframes stem-grow {
          0% { height: 0; }
          100% { height: 70px; }
        }
        @keyframes leaf-grow {
          0% { opacity: 0; transform: scale(0) rotate(var(--r)); }
          100% { opacity: 1; transform: scale(1) rotate(var(--r)); }
        }
        @keyframes tractor-move {
          0% { left: -60px; }
          100% { left: 100%; }
        }
        @keyframes wheel-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes furrow-appear {
          0% { width: 0; opacity: 0; }
          100% { width: 50px; opacity: 1; }
        }
        @keyframes crop-grow {
          0% { height: 0; }
          100% { height: 50px; }
        }
        @keyframes drop-fall {
          0% { opacity: 0; transform: translateY(0) scale(1); }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { opacity: 0; transform: translateY(100px) scale(0.5); }
        }
        @keyframes sun-rise {
          0% { bottom: 0; opacity: 0; }
          100% { bottom: 80px; opacity: 1; }
        }
        @keyframes ray-appear {
          0% { opacity: 0; height: 0; }
          100% { opacity: 0.6; height: 50px; }
        }
        @keyframes wheat-sway {
          0%, 100% { transform: rotate(0deg); }
          50% { transform: rotate(3deg); }
        }
        
        @media (prefers-reduced-motion: reduce) {
          .app-loader-content,
          .agri-animation * {
            animation: none !important;
          }
        }
      </style>
      <div class="app-loader" id="initial-loader">
        <div class="app-loader-content">
          <!-- Animation 1: Seed to Sprout -->
          <div class="agri-animation anim-seed-sprout" data-index="0">
            <div class="soil"></div>
            <div class="seed"></div>
            <div class="stem">
              <div class="leaf leaf-left"></div>
              <div class="leaf leaf-right"></div>
            </div>
          </div>
          
          <!-- Animation 2: Tractor Field -->
          <div class="agri-animation anim-tractor" data-index="1">
            <div class="field"></div>
            <div class="tractor">
              <div class="tractor-body">
                <div class="tractor-cabin"></div>
                <div class="wheel wheel-front"></div>
                <div class="wheel wheel-back"></div>
              </div>
            </div>
            <div class="furrow furrow-1"></div>
            <div class="furrow furrow-2"></div>
            <div class="furrow furrow-3"></div>
          </div>
          
          <!-- Animation 3: Water Drops -->
          <div class="agri-animation anim-water" data-index="2">
            <div class="ground"></div>
            <div class="crop crop-1"></div>
            <div class="crop crop-2"></div>
            <div class="crop crop-3"></div>
            <div class="drop drop-1"></div>
            <div class="drop drop-2"></div>
            <div class="drop drop-3"></div>
          </div>
          
          <!-- Animation 4: Sunrise Fields -->
          <div class="agri-animation anim-sunrise" data-index="3">
            <div class="field"></div>
            <div class="sun"></div>
            <div class="ray ray-1"></div>
            <div class="ray ray-2"></div>
            <div class="ray ray-3"></div>
            <div class="ray ray-4"></div>
            <div class="ray ray-5"></div>
          </div>
          
          <!-- Animation 5: Harvest Wheat -->
          <div class="agri-animation anim-harvest" data-index="4">
            <div class="ground"></div>
            <div class="wheat wheat-1"><div class="wheat-head"></div></div>
            <div class="wheat wheat-2"><div class="wheat-head"></div></div>
            <div class="wheat wheat-3"><div class="wheat-head"></div></div>
            <div class="wheat wheat-4"><div class="wheat-head"></div></div>
            <div class="wheat wheat-5"><div class="wheat-head"></div></div>
          </div>
          
          <div class="app-loader-text">Loading Farm Portal</div>
          <div class="app-loader-subtext">Preparing your workspace...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Agricultural Animation Rotation System
      (function() {
        const TOTAL_ANIMATIONS = 5;
        const STORAGE_KEY = 'agri_splash_animation_index';
        const COLOR_CACHE_KEY = 'tenant_primary_color';
        
        // Get next animation index
        let lastIndex = parseInt(localStorage.getItem(STORAGE_KEY) || '0');
        let nextIndex = (lastIndex + 1) % TOTAL_ANIMATIONS;
        
        console.log('🎬 Initial Loader Animation:', { lastIndex, nextIndex });
        
        // Show only the selected animation
        const animations = document.querySelectorAll('.agri-animation');
        animations.forEach((el, i) => {
          if (i === nextIndex) {
            el.classList.add('active');
            console.log('✅ Showing animation:', i);
          }
        });
        
        // Increment for next time
        localStorage.setItem(STORAGE_KEY, nextIndex.toString());
        
        // Apply cached tenant color if available
        const cachedColor = localStorage.getItem(COLOR_CACHE_KEY);
        if (cachedColor) {
          console.log('🎨 Applying cached color:', cachedColor);
          document.documentElement.style.setProperty('--loader-primary', cachedColor);
          // Calculate darker shade for gradient
          const hslMatch = cachedColor.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
          if (hslMatch) {
            const [, h, s, l] = hslMatch;
            const darkerL = Math.max(0, parseInt(l) - 10);
            const lighterL = Math.min(100, parseInt(l) + 15);
            document.documentElement.style.setProperty('--loader-dark', `hsl(${h}, ${s}%, ${darkerL}%)`);
            document.documentElement.style.setProperty('--loader-light', `hsl(${h}, ${s}%, ${lighterL}%)`);
          }
        }
      })();
      
      // Remove loader when React takes over
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader && window.__REACT_LOADED__) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.3s ease-out';
            setTimeout(() => loader.remove(), 300);
          }
        }, 100);
      });
    </script>
  </body>
</html>
